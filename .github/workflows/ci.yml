name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check nvim/ scripts/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.12.6
      - name: Check shortcuts match docs/keymaps.md
        run: nvim --clean --headless -l scripts/check-keymaps.lua
      - name: Start kakvim with no errors
        run: scripts/smoke-test.sh
      - name: Install script checks the requirements and links the config
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          # The runner has no ruby-lsp, so the script must stop and change nothing
          if scripts/install.sh; then exit 1; fi
          test ! -e "$XDG_CONFIG_HOME/nvim"
          # Stub the tools that the runner does not have
          mkdir -p "$RUNNER_TEMP/bin"
          for tool in rg tree-sitter ruby-lsp; do
            if ! command -v "$tool" >/dev/null; then
              printf '#!/bin/sh\n' > "$RUNNER_TEMP/bin/$tool"
              chmod +x "$RUNNER_TEMP/bin/$tool"
            fi
          done
          export PATH="$RUNNER_TEMP/bin:$PATH"
          scripts/install.sh
          scripts/install.sh
          test "$(readlink "$XDG_CONFIG_HOME/nvim")" = "$PWD/nvim"
